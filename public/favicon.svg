<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Accent Blue to Indigo Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="12" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))" />

  <!-- Outer Tech Ring Circle -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="6" stroke-dasharray="16 12" />

  <!-- Code Emblem Bracket Icons < MA /> -->
  <g transform="translate(256, 256)">
    <!-- Left Bracket < -->
    <path d="M -130 -45 L -180 0 L -130 45" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Monogram Text MA -->
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="124" font-weight="900" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-2">MA</text>
    
    <!-- Right Slash Bracket /> -->
    <path d="M 130 -45 L 180 0 L 130 45" fill="none" stroke="#818cf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>